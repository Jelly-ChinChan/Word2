<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高二適性單字測驗</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-xl mx-auto px-4 py-8 w-full relative">
        <!-- 右上角狹長方形返回按鈕 -->
        <div class="flex justify-end mb-2">
            <button id="back-to-setup-btn" type="button" class="hidden text-xs bg-white hover:bg-slate-100 text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-lg transition font-medium shadow-2xs">
                ⚙️ 回首頁 / 更換模式
            </button>
        </div>

        <!-- 置中標題區 -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">📝 高二適性單字測驗</h1>
            <p class="text-sm text-slate-500 mt-1">115級真理之門專題生</p>
        </header>

        <!-- 使用者資訊與模式設定區 -->
        <section id="setup-section" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h2 class="text-lg font-semibold mb-3 text-slate-700">👤 選擇學生與測驗模式</h2>
            
            <!-- 學生姓名下拉式選單 -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-500 mb-1">請選擇您的姓名</label>
                <select id="student-select" class="w-full border border-slate-200 bg-white rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
                    <option value="" disabled selected>-- 請點選您的名字 --</option>
                    <option value="張棨翔">張棨翔</option>
                    <option value="陳廷宥">陳廷宥</option>
                    <option value="張翔凱">張翔凱</option>
                    <option value="項怡瑄">項怡瑄</option>
                    <option value="夏翌眒">夏翌眒</option>
                    <option value="朱恩萭">朱恩萭</option>
                    <option value="張幼昕">張幼昕</option>
                    <option value="林宸楷">林宸楷</option>
                    <option value="李曜晴">李曜晴</option>
                    <option value="張雯芯">張雯芯</option>
                    <option value="陳予彤">陳予彤</option>
                    <option value="施泓宇">施泓宇</option>
                    <option value="劉定穎">劉定穎</option>
                    <option value="張琦紜">張琦紜</option>
                    <option value="張晉維">張晉維</option>
                    <option value="陳楚弦">陳楚弦</option>
                    <option value="何彥澄">何彥澄</option>
                    <option value="陳柏亨">陳柏亨</option>
                </select>
            </div>

            <div class="mb-2">
                <label class="block text-xs font-medium text-slate-500 mb-1">選擇測驗模式</label>
                <div class="grid grid-cols-3 gap-2" id="mode-selector">
                    <button type="button" data-mode="1" class="mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-indigo-600 bg-indigo-600 text-white transition">模式一<br>【手寫輸入】</button>
                    <button type="button" data-mode="2" class="mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition">模式二<br>【中文選擇】</button>
                    <button type="button" data-mode="3" class="mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition">模式三<br>【英文選擇】</button>
                </div>
            </div>
            <button id="start-btn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-sm">開始測驗 / 重新開始</button>
        </section>

        <!-- 答題主畫面 -->
        <main id="quiz-section" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <!-- 進度卡片 -->
            <div class="bg-slate-100 p-3 rounded-xl mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span id="progress-round-text" class="text-xs font-semibold text-slate-600">🎯 第 1 回合</span>
                    <span id="progress-count-text" class="text-xs font-semibold text-slate-600">進度：1 / 5</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 20%"></div>
                </div>
            </div>

            <!-- 題目顯示區 -->
            <div class="mb-6">
                <div class="text-lg font-bold text-slate-800 mb-3 leading-relaxed">
                    <span id="question-prefix">Q1. </span><span id="cloze-word-target" class="cursor-pointer text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200 hover:bg-indigo-100 transition inline-block my-1" title="點擊顯示/隱藏完整單字">r_______e</span><span id="question-suffix"> with her new hairstyle.</span>
                </div>
                
                <!-- 中文提示按鈕與展開區塊 -->
                <div class="mb-4">
                    <button id="toggle-hint-btn" type="button" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition font-medium inline-flex items-center gap-1">
                        💡 顯示中文提示
                    </button>
                    <div id="question-sub" class="text-sm text-slate-500 mt-2 hidden bg-slate-50 p-3 rounded-xl border border-slate-100"></div>
                </div>

                <!-- 模式一：手寫輸入 -->
                <div id="input-mode-container" class="space-y-3">
                    <input type="text" id="user-answer-input" autocomplete="off" placeholder="請輸入英文單字..." class="w-full border border-slate-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button id="submit-input-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">送出答案</button>
                </div>

                <!-- 模式二與三：選項選擇（點擊即答） -->
                <div id="choice-mode-container" class="space-y-2 hidden">
                    <!-- 動態產生選項按鈕 -->
                </div>

                <!-- 回饋訊息 -->
                <div id="feedback-area" class="mt-4 text-sm font-semibold hidden"></div>
            </div>

            <!-- 下一題按鈕 -->
            <button id="next-btn" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">下一題</button>
        </main>

        <!-- 結算畫面 -->
        <section id="result-section" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">🎉 測驗結算</h2>
            <div class="space-y-2 my-6 text-slate-600">
                <p class="text-lg">學生姓名：<span id="res-student" class="font-bold text-indigo-600">-</span></p>
                <p class="text-lg">總答題數：<span id="res-total" class="font-bold text-slate-800">0</span></p>
                <p class="text-lg">正確題數：<span id="res-correct" class="font-bold text-emerald-600">0</span></p>
                <p class="text-xl font-semibold">正確率：<span id="res-acc" class="text-indigo-600">0.0%</span></p>
            </div>
            <button id="restart-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">再玩一次</button>
        </section>

        <!-- 錯題集專區 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
                <span>📘 本次錯題集 (Wrong-book)</span>
                <span id="wrong-count-badge" class="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full">0 題</span>
            </h3>
            <div id="wrongbook-list" class="space-y-2 text-sm text-slate-500">
                <p class="text-slate-400 italic text-xs">目前沒有錯題記錄。</p>
            </div>
        </section>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center py-4 text-xs text-slate-400">
        高二適性單字測驗 &copy; 2026 - 115級真理之門專題生
    </footer>

    <!-- 內嵌題庫與前端邏輯 -->
    <script>
        const QUESTION_BANK = [
            { "answer_en": "promising", "meaning_zh": "有前途的、有希望的", "sent_en": "She is a promising young artist with a bright future.", "sent_zh": "她是一位前途無量、有著光明未來的年輕藝術家。" },
            { "answer_en": "achieve", "meaning_zh": "達成、實現", "sent_en": "Hard work is necessary to achieve your goals.", "sent_zh": "努力工作是實現目標所必需的。" },
            { "answer_en": "challenge", "meaning_zh": "挑戰", "sent_en": "The project is a great challenge for our team.", "sent_zh": "這個專案對我們的團隊來說是一大挑戰。" },
            { "answer_en": "confident", "meaning_zh": "有信心的", "sent_en": "He is confident about passing the exam.", "sent_zh": "他對通過考試很有信心。" },
            { "answer_en": "development", "meaning_zh": "發展、開發", "sent_en": "Technological development has changed our lives.", "sent_zh": "科技的發展已經改變了我們的工作與生活。" },
            { "answer_en": "efficient", "meaning_zh": "有效率的", "sent_en": "This new machine is much more efficient.", "sent_zh": "這台新機器有效率得多。" },
            { "answer_en": "feature", "meaning_zh": "特色、特徵", "sent_en": "A key feature of the new smartphone is its camera.", "sent_zh": "新款智慧型手機的一個核心特色是它的相機。" },
            { "answer_en": "global", "meaning_zh": "全球的", "sent_en": "Climate change is a global problem.", "sent_zh": "氣候變遷是一個全球性的問題。" },
            { "answer_en": "independent", "meaning_zh": "獨立的", "sent_en": "She wanted to be financially independent.", "sent_zh": "她想要在經濟上獨立。" },
            { "answer_en": "opportunity", "meaning_zh": "機會", "sent_en": "Don't miss this great opportunity.", "sent_zh": "不要錯過這個絕佳的機會。" },
            { "answer_en": "patient", "meaning_zh": "有耐心的、病人", "sent_en": "You need to be patient when learning a language.", "sent_zh": "學習語言時你需要有耐心。" },
            { "answer_en": "quality", "meaning_zh": "品質", "sent_en": "We focus on the quality of our products.", "sent_zh": "我們專注於產品的品質。" },
            { "answer_en": "recognize", "meaning_zh": "認出、承認", "sent_en": "I didn't recognize her with her new hairstyle.", "sent_zh": "她換了新髮型，我差點認不出她來。" },
            { "answer_en": "success", "meaning_zh": "成功", "sent_en": "Practice is the key to success.", "sent_zh": "練習是成功的關鍵。" },
            { "answer_en": "traditional", "meaning_zh": "傳統的", "sent_en": "They wore traditional clothes for the festival.", "sent_zh": "他們為節慶穿上了傳統服飾。" }
        ];

        let currentMode = "1";
        let currentRound = 1;
        let maxRounds = 3;
        let questionsPerRound = 5;
        let curRoundIndices = [];
        let curIndexInRound = 0;
        let scoreThisRound = 0;
        let records = [];
        let wrongbook = {};
        let isSubmitted = false;
        let isWordRevealed = false;
        let currentStudent = "";

        function levenshtein(a, b) {
            if (a.length < b.length) return levenshtein(b, a);
            if (b.length === 0) return a.length;
            let prev = Array.from({length: b.length + 1}, (_, i) => i);
            for (let i = 0; i < a.length; i++) {
                let curr = [i + 1];
                for (let j = 0; j < b.length; j++) {
                    curr.push(Math.min(prev[j + 1] + 1, curr[j] + 1, prev[j] + (a[i] !== b[j])));
                }
                prev = curr;
            }
            return prev[prev.length - 1];
        }

        function getPos(word) {
            let w = word.toLowerCase();
            if (w.endsWith("able") || w.endsWith("ible") || w.endsWith("al") || w.endsWith("ful") || w.endsWith("ic") || w.endsWith("ive") || w.endsWith("less") || w.endsWith("ous")) return "adj";
            if (w.endsWith("ly")) return "adv";
            if (w.endsWith("ate") || w.endsWith("en") || w.endsWith("ify") || w.endsWith("ise") || w.endsWith("ize") || w.endsWith("ed") || w.endsWith("ing")) return "verb";
            if (w.endsWith("tion") || w.endsWith("sion") || w.endsWith("ment") || w.endsWith("ness") || w.endsWith("ity") || w.endsWith("er") || w.endsWith("or") || w.endsWith("ism") || w.endsWith("ist") || w.endsWith("ship") || w.endsWith("s")) return "noun";
            return "other";
        }

        function getSmartDistractors(word, meaningZh, k = 3) {
            let cands = new Set();
            QUESTION_BANK.forEach(it => {
                if (it.answer_en !== word && levenshtein(word, it.answer_en) <= 3) cands.add(it.answer_en);
            });
            let pos = getPos(word);
            QUESTION_BANK.forEach(it => {
                if (it.answer_en !== word && getPos(it.answer_en) === pos) cands.add(it.answer_en);
            });
            if (meaningZh) {
                let head = meaningZh.slice(0, 1);
                QUESTION_BANK.forEach(it => {
                    if (it.answer_en !== word && it.meaning_zh.startsWith(head)) cands.add(it.answer_en);
                });
            }

            let candsArr = Array.from(cands);
            if (candsArr.length < k) {
                let pool = QUESTION_BANK.filter(it => it.answer_en !== word).map(it => it.answer_en);
                pool.sort(() => Math.random() - 0.5);
                for (let p of pool) {
                    if (!candsArr.includes(p) && candsArr.length < k) candsArr.push(p);
                }
            }
            candsArr.sort(() => Math.random() - 0.5);
            return candsArr.slice(0, k);
        }

        function initQuiz() {
            let studentSelect = document.getElementById('student-select');
            currentStudent = studentSelect.value;
            if (!currentStudent) {
                alert("請先下拉選擇您的姓名！");
                return;
            }

            currentRound = 1;
            records = [];
            wrongbook = {};
            startNewRound();
        }

        function startNewRound() {
            let indices = Array.from({length: QUESTION_BANK.length}, (_, i) => i);
            indices.sort(() => Math.random() - 0.5);
            curRoundIndices = indices.slice(0, Math.min(questionsPerRound, QUESTION_BANK.length));
            curIndexInRound = 0;
            scoreThisRound = 0;
            isSubmitted = false;
            
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('back-to-setup-btn').classList.remove('hidden');
            
            loadQuestion();
        }

        function makeClozeWord(word) {
            if (word.length <= 2) {
                return "_".repeat(word.length);
            }
            let first = word[0];
            let last = word[word.length - 1];
            let middleUnderscores = "_".repeat(word.length - 2);
            return first + middleUnderscores + last;
        }

        function loadQuestion() {
            isSubmitted = false;
            isWordRevealed = false;
            let qidx = curRoundIndices[curIndexInRound];
            let q = QUESTION_BANK[qidx];

            document.getElementById('progress-round-text').innerText = `🎯 第 ${currentRound} 回合 (${currentStudent})`;
            let totalQ = curRoundIndices.length;
            let currentNum = curIndexInRound + 1;
            document.getElementById('progress-count-text').innerText = `進度：${currentNum} / ${totalQ}`;
            let pct = (currentNum / totalQ) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            let parts = q.sent_en.split(new RegExp(`\\b${q.answer_en}\\b`, 'i'));
            document.getElementById('question-prefix').innerText = `Q${currentNum}. ${parts[0] || ""}`;
            document.getElementById('question-suffix').innerText = parts[1] || "";

            let targetEl = document.getElementById('cloze-word-target');
            targetEl.innerText = makeClozeWord(q.answer_en);
            
            targetEl.onclick = function() {
                isWordRevealed = !isWordRevealed;
                if (isWordRevealed) {
                    targetEl.innerText = q.answer_en;
                    targetEl.className = "cursor-pointer text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 font-bold transition inline-block my-1";
                } else {
                    targetEl.innerText = makeClozeWord(q.answer_en);
                    targetEl.className = "cursor-pointer text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200 hover:bg-indigo-100 transition inline-block my-1";
                }
            };

            let subEl = document.getElementById('question-sub');
            subEl.innerText = q.sent_zh;
            subEl.classList.add('hidden');
            let hintBtn = document.getElementById('toggle-hint-btn');
            hintBtn.innerText = "💡 顯示中文提示";

            let feedbackEl = document.getElementById('feedback-area');
            feedbackEl.classList.add('hidden');
            feedbackEl.innerHTML = "";

            let inputContainer = document.getElementById('input-mode-container');
            let choiceContainer = document.getElementById('choice-mode-container');
            let nextBtn = document.getElementById('next-btn');
            nextBtn.classList.add('hidden');

            if (currentMode === "1") {
                inputContainer.classList.remove('hidden');
                choiceContainer.classList.add('hidden');
                let inputField = document.getElementById('user-answer-input');
                inputField.value = "";
                inputField.disabled = false;
                inputField.focus();
            } else {
                inputContainer.classList.add('hidden');
                choiceContainer.classList.remove('hidden');
                
                let distractorsEn = getSmartDistractors(q.answer_en, q.meaning_zh, 3);
                let optionsData = [];
                
                if (currentMode === "2") {
                    optionsData.push({ text: q.meaning_zh, subText: ` (${q.answer_en})`, rawEn: q.answer_en, isCorrect: true });
                    distractorsEn.forEach(en => {
                        let found = QUESTION_BANK.find(item => item.answer_en === en);
                        if (found) {
                            optionsData.push({ text: found.meaning_zh, subText: ` (${found.answer_en})`, rawEn: found.answer_en, isCorrect: false });
                        }
                    });
                } else {
                    optionsData.push({ text: q.answer_en, subText: ` (${q.meaning_zh})`, rawEn: q.answer_en, isCorrect: true });
                    distractorsEn.forEach(en => {
                        let found = QUESTION_BANK.find(item => item.answer_en === en);
                        let mZh = found ? found.meaning_zh : "";
                        optionsData.push({ text: en, subText: ` (${mZh})`, rawEn: en, isCorrect: false });
                    });
                }
                optionsData.sort(() => Math.random() - 0.5);

                choiceContainer.innerHTML = "";
                optionsData.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.type = "button";
                    btn.className = "choice-option w-full text-left p-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition font-medium text-slate-700";
                    btn.innerText = opt.text;
                    
                    btn.onclick = function() {
                        if (isSubmitted) return;
                        isSubmitted = true;
                        
                        let isCorrect = opt.isCorrect;
                        let chosenLabel = opt.rawEn;

                        let allBtns = choiceContainer.querySelectorAll('.choice-option');
                        allBtns.forEach((b, idx) => {
                            b.disabled = true;
                            let correspondingOpt = optionsData[idx];
                            b.innerText = correspondingOpt.text + correspondingOpt.subText;

                            if (correspondingOpt.isCorrect) {
                                b.className = "choice-option w-full text-left p-3 border border-emerald-500 bg-emerald-50 text-emerald-700 font-bold rounded-xl transition";
                            } else if (b === btn && !isCorrect) {
                                b.className = "choice-option w-full text-left p-3 border border-rose-500 bg-rose-50 text-rose-700 font-bold rounded-xl transition";
                            } else {
                                b.className = "choice-option w-full text-left p-3 border border-slate-200 bg-slate-50 text-slate-400 rounded-xl transition opacity-60";
                            }
                        });

                        let feedbackEl = document.getElementById('feedback-area');
                        feedbackEl.classList.remove('hidden');

                        if (isCorrect) {
                            feedbackEl.innerHTML = "<div class='text-emerald-600 font-bold'>✅ 回答正確！</div>";
                            scoreThisRound++;
                        } else {
                            feedbackEl.innerHTML = `<div class='text-rose-600 font-bold'>❌ 錯誤。正確答案：${q.answer_en} (${q.meaning_zh})</div>`;
                            if (!wrongbook[q.answer_en]) {
                                wrongbook[q.answer_en] = { ...q, count: 0, chosen: [] };
                            }
                            wrongbook[q.answer_en].count++;
                            wrongbook[q.answer_en].chosen.push(chosenLabel);
                            renderWrongbook();
                        }

                        records.push({ round: currentRound, qidx, chosen: chosenLabel, correct: q.answer_en, isCorrect });
                        nextBtn.classList.remove('hidden');
                    };
                    choiceContainer.appendChild(btn);
                });
            }
        }

        document.getElementById('submit-input-btn').onclick = function() {
            if (isSubmitted) return;
            let qidx = curRoundIndices[curIndexInRound];
            let q = QUESTION_BANK[qidx];
            let inputField = document.getElementById('user-answer-input');
            let chosenLabel = inputField.value.trim();
            
            if (!chosenLabel) {
                alert("請先輸入英文單字！");
                return;
            }

            isSubmitted = true;
            inputField.disabled = true;
            let isCorrect = chosenLabel.toLowerCase() === q.answer_en.toLowerCase();

            let feedbackEl = document.getElementById('feedback-area');
            feedbackEl.classList.remove('hidden');

            if (isCorrect) {
                feedbackEl.innerHTML = "<div class='text-emerald-600 font-bold'>✅ 回答正確！</div>";
                scoreThisRound++;
            } else {
                feedbackEl.innerHTML = `<div class='text-rose-600 font-bold'>❌ 錯誤。正確答案：${q.answer_en} (${q.meaning_zh})</div>`;
                if (!wrongbook[q.answer_en]) {
                    wrongbook[q.answer_en] = { ...q, count: 0, chosen: [] };
                }
                wrongbook[q.answer_en].count++;
                wrongbook[q.answer_en].chosen.push(chosenLabel);
                renderWrongbook();
            }

            records.push({ round: currentRound, qidx, chosen: chosenLabel, correct: q.answer_en, isCorrect });
            document.getElementById('next-btn').classList.remove('hidden');
        };

        document.getElementById('next-btn').onclick = function() {
            curIndexInRound++;
            if (curIndexInRound >= curRoundIndices.length) {
                if (scoreThisRound === curRoundIndices.length && currentRound < maxRounds) {
                    currentRound++;
                    startNewRound();
                } else {
                    showResult();
                }
            } else {
                loadQuestion();
            }
        };

        document.getElementById('back-to-setup-btn').onclick = function() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('back-to-setup-btn').classList.add('hidden');
        };

        document.getElementById('toggle-hint-btn').onclick = function() {
            let subEl = document.getElementById('question-sub');
            if (subEl.classList.contains('hidden')) {
                subEl.classList.remove('hidden');
                this.innerText = "隱藏中文提示";
            } else {
                subEl.classList.add('hidden');
                this.innerText = "💡 顯示中文提示";
            }
        };

        function showResult() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('back-to-setup-btn').classList.add('hidden');

            let total = records.length;
            let correct = records.filter(r => r.isCorrect).length;
            let acc = total > 0 ? (correct / total * 100).toFixed(1) : 0;

            document.getElementById('res-student').innerText = currentStudent;
            document.getElementById('res-total').innerText = total;
            document.getElementById('res-correct').innerText = correct;
            document.getElementById('res-acc').innerText = `${acc}%`;
        }

        function renderWrongbook() {
            let container = document.getElementById('wrongbook-list');
            let keys = Object.keys(wrongbook);
            document.getElementById('wrong-count-badge').innerText = `${keys.length} 題`;

            if (keys.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-xs">目前沒有錯題記錄。</p>`;
                return;
            }

            container.innerHTML = "";
            keys.forEach(key => {
                let w = wrongbook[key];
                let div = document.createElement('div');
                div.className = "p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs space-y-1";
                div.innerHTML = `
                    <div class="font-bold text-slate-700 flex justify-between">
                        <span>${w.answer_en} (${w.meaning_zh})</span>
                        <span class="text-rose-500">錯 ${w.count} 次</span>
                    </div>
                    <div class="text-slate-500">例句：${w.sent_en}</div>
                    <div class="text-slate-400">你的回答：${w.chosen.join(', ')}</div>
                `;
                container.appendChild(div);
            });
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.className = "mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition";
                });
                this.className = "mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-indigo-600 bg-indigo-600 text-white transition";
                currentMode = this.getAttribute('data-mode');
            };
        });

        document.getElementById('start-btn').onclick = initQuiz;
        document.getElementById('restart-btn').onclick = function() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
        };
    </script>
</body>
</html>
