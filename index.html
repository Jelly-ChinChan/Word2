    <style>
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }

            animation: pulse-fast 1s infinite;
        }
    </style>
</head>

            </div>
            <button id="back-to-setup-btn" type="button" class="hidden absolute right-0 top-1 text-xs bg-white hover:bg-slate-100 text-indigo-600 border border-indigo-200 px-2 py-3 rounded-lg transition font-medium shadow-2xs leading-tight text-center">
                回<br>首<br>頁
            </button>
        </header>

        <!-- 使用者資訊與模式設定區 -->
        <section id="setup-section" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">

                    <option value="陳廷宥">陳廷宥</option>
                    <option value="張翔凱">張翔凱</option>
                    <option value="項怡瑄">項怡瑄</option>
                    <option value="夏翌眒">夏翌眒</option>
                    <option value="朱恩萭">朱恩萭</option>
                    <option value="張幼昕">張幼昕</option>
                    <option value="林宸楷">林宸楷</option>
                    <option value="李曜晴">李曜晴</option>
                    <option value="張雯芯">張雯芯</option>

                    <option value="劉定穎">劉定穎</option>
                    <option value="張琦紜">張琦紜</option>
                    <option value="張晉維">張晉維</option>
                    <option value="陳楚弦">陳楚弦</option>
                    <option value="何彥澄">何彥澄</option>
                    <option value="陳柏亨">陳柏亨</option>

            <div class="mb-2">
                <label class="block text-xs font-medium text-slate-500 mb-1">選擇測驗模式</label>
                <div class="grid grid-cols-3 gap-2" id="mode-selector">
                    <button type="button" data-mode="1" class="mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-indigo-600 bg-indigo-600 text-white transition">模式一<br>【手寫輸入】</button>
                    <button type="button" data-mode="2" class="mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition">模式二<br>【中文選擇】</button>
                    <button type="button" data-mode="3" class="mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition">模式三<br>【英文選擇】</button>

            </div>
            <button id="start-btn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-sm">開始測驗 / 重新開始</button>
        </section>

        <!-- 答題主畫面 -->
        <main id="quiz-section" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <div id="progress-card" class="bg-slate-100 p-3 rounded-xl mb-6 transition-colors">

                </div>
            </div>

            <div class="mb-6">
                <div class="text-lg font-bold text-slate-800 mb-3 leading-relaxed">
                    <span id="question-prefix">Q1. </span><span id="cloze-word-target" class="cursor-pointer text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200 hover:bg-indigo-100 transition inline-block my-1" title="點擊顯示/隱藏完整單字">r_______e</span><span id="question-suffix"> with her new hairstyle.</span>
                </div>
                
                <div class="mb-4">
                    <button id="toggle-hint-btn" type="button" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition font-medium inline-flex items-center gap-1">

                    </button>

                <div id="input-mode-container" class="space-y-3">
                    <input type="text" id="user-answer-input" autocomplete="off" placeholder="請輸入英文單字..." class="w-full border border-slate-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button id="submit-input-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">送出答案</button>
                </div>

                <div id="choice-mode-container" class="space-y-2 hidden"></div>

                <div id="feedback-area" class="mt-4 text-sm font-semibold hidden"></div>
            </div>

            <button id="next-btn" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">下一題</button>
        </main>

        <!-- 結算畫面 -->
        <section id="result-section" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center mb-6">
            <h2 id="result-title" class="text-2xl font-bold text-slate-800 mb-2">🎉 測驗結算</h2>
            <div class="space-y-2 my-6 text-slate-600">
                <p class="text-lg">學生姓名：<span id="res-student" class="font-bold text-indigo-600">-</span></p>
                <p class="text-lg">總答題數：<span id="res-total" class="font-bold text-slate-800">0</span></p>
                <p class="text-lg">正確題數：<span id="res-correct" class="font-bold text-emerald-600">0</span></p>
                <p class="text-xl font-semibold">正確率：<span id="res-acc" class="text-indigo-600">0.0%</span></p>
            </div>
            <div id="continue-container" class="mb-3 hidden">
                <button id="continue-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-sm mb-2">繼續挑戰下一關（不重複已考過題目）</button>
            </div>
            <button id="restart-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm">重新開始</button>
        </section>

            <p class="text-xl md:text-2xl text-white mb-8">太神啦！您已成功擊敗所有大魔王關卡！</p>
            <button id="victory-close-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold px-8 py-4 rounded-2xl shadow-lg transition">返回首頁</button>
        </div>

        <!-- 錯題集專區 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="font-semibold text-slate-700 mb-3 flex items-center justify-between">
                <span>📘 本次錯題集 (Wrong-book)</span>
                <span id="wrong-count-badge" class="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full">0 題</span>
            </h3>
            <div id="wrongbook-list" class="space-y-2 text-sm text-slate-500">
                <p class="text-slate-400 italic text-xs">目前沒有錯題記錄。</p>
            </div>
        </section>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center py-4 text-xs text-slate-400">
        高二適性單字測驗 (L4-L6) &copy; 2026 - 115級真理之門專題生
    </footer>

        let currentMode = "1";

        function levenshtein(a, b) {
            if (a.length < b.length) return levenshtein(b, a);
            if (b.length === 0) return a.length;
            let prev = Array.from({length: b.length + 1}, (_, i) => i);
            for (let i = 0; i < a.length; i++) {
                let curr = [i + 1];
                for (let j = 0; j < b.length; j++) {
                    curr.push(Math.min(prev[j + 1] + 1, curr[j] + 1, prev[j] + (a[i] !== b[j])));
                }
                prev = curr;
            }
            return prev[prev.length - 1];
        }

        function getPos(word) {
            let w = word.toLowerCase();
            if (w.endsWith("able") || w.endsWith("ible") || w.endsWith("al") || w.endsWith("ful") || w.endsWith("ic") || w.endsWith("ive") || w.endsWith("less") || w.endsWith("ous")) return "adj";
            if (w.endsWith("ly")) return "adv";
            if (w.endsWith("ate") || w.endsWith("en") || w.endsWith("ify") || w.endsWith("ise") || w.endsWith("ize") || w.endsWith("ed") || w.endsWith("ing")) return "verb";
            if (w.endsWith("tion") || w.endsWith("sion") || w.endsWith("ment") || w.endsWith("ness") || w.endsWith("ity") || w.endsWith("er") || w.endsWith("or") || w.endsWith("ism") || w.endsWith("ist") || w.endsWith("ship") || w.endsWith("s")) return "noun";
            return "other";
        }

        function getSmartDistractors(word, meaningZh, k = 3) {
            let cands = new Set();
            QUESTION_BANK.forEach(it => {
                if (it.answer_en !== word && levenshtein(word, it.answer_en) <= 3) cands.add(it.answer_en);
            });
            let pos = getPos(word);
            QUESTION_BANK.forEach(it => {
                if (it.answer_en !== word && getPos(it.answer_en) === pos) cands.add(it.answer_en);
            });
            if (meaningZh) {
                let head = meaningZh.slice(0, 1);
                QUESTION_BANK.forEach(it => {
                    if (it.answer_en !== word && it.meaning_zh.startsWith(head)) cands.add(it.answer_en);
                });
            }

            let candsArr = Array.from(cands);
            if (candsArr.length < k) {
                let pool = QUESTION_BANK.filter(it => it.answer_en !== word).map(it => it.answer_en);
                pool.sort(() => Math.random() - 0.5);
                for (let p of pool) {
                    if (!candsArr.includes(p) && candsArr.length < k) candsArr.push(p);
                }
            }
            candsArr.sort(() => Math.random() - 0.5);
            return candsArr.slice(0, k);
        }

        function makeClozeWord(word, mode) {
            if (mode === "3") {
                return "_".repeat(word.length);
            }
            if (word.length <= 2) {
                return "_".repeat(word.length);
            }
            let first = word[0];
            let last = word[word.length - 1];
            let middleUnderscores = "_".repeat(word.length - 2);
            return first + middleUnderscores + last;
        }

        function loadQuestion() {
            if (globalQuestionIndex >= shuffledBank.length) {
                triggerVictory();
                return;
            }

            isSubmitted = false;
            isWordRevealed = false;
            let currentQNum = globalQuestionIndex + 1;
            let q = shuffledBank[globalQuestionIndex];

            applyBossTheme(currentQNum);

            let roundNum = Math.floor(globalQuestionIndex / 5) + 1;
            let inRoundIdx = (globalQuestionIndex % 5) + 1;

            document.getElementById('progress-round-text').innerText = `🔥 第 ${roundNum} 關 (總第 ${currentQNum} 題) (${currentStudent})`;
            document.getElementById('progress-count-text').innerText = `本關進度：${inRoundIdx} / 5`;
            let pct = (inRoundIdx / 5) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            let parts = q.sent_en.split(new RegExp(`\\b${q.answer_en}\\b`, 'i'));
            document.getElementById('question-prefix').innerText = `Q${currentQNum}. ${parts[0] || ""}`;
            document.getElementById('question-suffix').innerText = parts[1] || "";

            let targetEl = document.getElementById('cloze-word-target');
            targetEl.innerText = makeClozeWord(q.answer_en, currentMode);
            
            targetEl.onclick = function() {
                isWordRevealed = !isWordRevealed;

            let subEl = document.getElementById('question-sub');

            hintBtn.innerText = "💡 顯示中文提示";

            let feedbackEl = document.getElementById('feedback-area');

            let inputContainer = document.getElementById('input-mode-container');
            let choiceContainer = document.getElementById('choice-mode-container');
            let nextBtn = document.getElementById('next-btn');
            nextBtn.classList.add('hidden');

            if (currentMode === "1") {
                inputContainer.classList.remove('hidden');
                choiceContainer.classList.add('hidden');
                let inputField = document.getElementById('user-answer-input');
                inputField.value = "";
                inputField.disabled = false;
                inputField.focus();

                // 移除舊的監聽器並綁定即時輸入檢查
                inputField.oninput = function() {
                    if (isSubmitted) return;
                    let val = inputField.value.trim();
                    if (val.toLowerCase() === q.answer_en.toLowerCase()) {
                        // 輸入正確的瞬間，自動觸發送出與公布答案
                        triggerInputSubmit(true);
                    }
                };
            } else {
                inputContainer.classList.add('hidden');
                choiceContainer.classList.remove('hidden');
                
                let distractorsEn = getSmartDistractors(q.answer_en, q.meaning_zh, 3);
                let optionsData = [];
                
                if (currentMode === "2") {
                    optionsData.push({ text: q.meaning_zh, subText: ` (${q.answer_en})`, rawEn: q.answer_en, isCorrect: true });
                    distractorsEn.forEach(en => {
                        let found = QUESTION_BANK.find(item => item.answer_en === en);
                        if (found) {
                            optionsData.push({ text: found.meaning_zh, subText: ` (${found.answer_en})`, rawEn: found.answer_en, isCorrect: false });
                        }
                    });
                } else {
                    optionsData.push({ text: q.answer_en, subText: ` (${q.meaning_zh})`, rawEn: q.answer_en, isCorrect: true });
                    distractorsEn.forEach(en => {
                        let found = QUESTION_BANK.find(item => item.answer_en === en);
                        let mZh = found ? found.meaning_zh : "";
                        optionsData.push({ text: en, subText: ` (${mZh})`, rawEn: en, isCorrect: false });
                    });
                }
                optionsData.sort(() => Math.random() - 0.5);

                choiceContainer.innerHTML = "";
                optionsData.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.type = "button";
                    btn.className = "choice-option w-full text-left p-3 border border-slate-600 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 transition font-medium text-slate-200";
                    btn.innerText = opt.text;
                    
                    btn.onclick = function() {
                        if (isSubmitted) return;
                        isSubmitted = true;
                        
                        let isCorrect = opt.isCorrect;
                        let chosenLabel = opt.rawEn;

                        let allBtns = choiceContainer.querySelectorAll('.choice-option');
                        allBtns.forEach((b, idx) => {
                            b.disabled = true;
                            let correspondingOpt = optionsData[idx];
                            b.innerText = correspondingOpt.text + correspondingOpt.subText;

                            if (correspondingOpt.isCorrect) {
                                b.className = "choice-option w-full text-left p-3 border border-emerald-500 bg-emerald-950/80 text-emerald-300 font-bold rounded-xl transition";
                            } else if (b === btn && !isCorrect) {
                                b.className = "choice-option w-full text-left p-3 border border-rose-500 bg-rose-950/80 text-rose-300 font-bold rounded-xl transition";
                            } else {
                                b.className = "choice-option w-full text-left p-3 border border-slate-700 bg-slate-800/30 text-slate-500 rounded-xl transition opacity-50";
                            }
                        });

                        let feedbackEl = document.getElementById('feedback-area');
                        feedbackEl.classList.remove('hidden');

                        if (isCorrect) {
                            feedbackEl.innerHTML = "<div class='text-emerald-400 font-bold'>✅ 回答正確！</div>";
                            scoreInCurrentRound++;
                        } else {
                            feedbackEl.innerHTML = `<div class='text-rose-400 font-bold'>❌ 錯誤。正確答案：${q.answer_en} (${q.meaning_zh})</div>`;
                            if (!wrongbook[q.answer_en]) {
                                wrongbook[q.answer_en] = { ...q, count: 0, chosen: [] };
                            }
                            wrongbook[q.answer_en].count++;
                            wrongbook[q.answer_en].chosen.push(chosenLabel);
                            renderWrongbook();
                        }

                        records.push({ round: roundNum, qidx: globalQuestionIndex, chosen: chosenLabel, correct: q.answer_en, isCorrect });
                        nextBtn.classList.remove('hidden');
                    };
                    choiceContainer.appendChild(btn);
                });
            }

        function triggerInputSubmit(isCorrect) {
            if (isSubmitted) return;
            isSubmitted = true;
            let q = shuffledBank[globalQuestionIndex];
            let inputField = document.getElementById('user-answer-input');
            let chosenLabel = inputField.value.trim();
            inputField.disabled = true;

            let feedbackEl = document.getElementById('feedback-area');
            feedbackEl.classList.remove('hidden');
            let roundNum = Math.floor(globalQuestionIndex / 5) + 1;

            if (isCorrect) {
                feedbackEl.innerHTML = "<div class='text-emerald-400 font-bold'>✅ 回答正確！</div>";
                scoreInCurrentRound++;
            } else {
                feedbackEl.innerHTML = `<div class='text-rose-400 font-bold'>❌ 錯誤。正確答案：<span class="underline">${q.answer_en}</span> (${q.meaning_zh})</div>`;
                if (!wrongbook[q.answer_en]) {
                    wrongbook[q.answer_en] = { ...q, count: 0, chosen: [] };
                }
                wrongbook[q.answer_en].count++;
                wrongbook[q.answer_en].chosen.push(chosenLabel);
                renderWrongbook();
            }

            records.push({ round: roundNum, qidx: globalQuestionIndex, chosen: chosenLabel, correct: q.answer_en, isCorrect });
            document.getElementById('next-btn').classList.remove('hidden');
        }

            }
            let isCorrect = chosenLabel.toLowerCase() === q.answer_en.toLowerCase();
            triggerInputSubmit(isCorrect);
        };

        function proceedToNext() {
            let nextBtn = document.getElementById('next-btn');
            if (!nextBtn.classList.contains('hidden')) {
                globalQuestionIndex++;
                let inRoundPos = globalQuestionIndex % 5;

                if (inRoundPos === 0) {
                    showRoundResult();
                } else {
                    loadQuestion();
                }
            }
        }

        document.getElementById('next-btn').onclick = proceedToNext;

        document.body.onclick = function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.id === 'cloze-word-target' || e.target.closest('button')) {
                return;
            }
            proceedToNext();
        };

        window.onkeydown = function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                proceedToNext();
            }
        };

        function showRoundResult() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('back-to-setup-btn').classList.add('hidden');

            let total = records.length;
            let correct = records.filter(r => r.isCorrect).length;
            let acc = total > 0 ? (correct / total * 100).toFixed(1) : 0;

            document.getElementById('res-student').innerText = currentStudent;
            document.getElementById('res-total').innerText = total;
            document.getElementById('res-correct').innerText = correct;
            document.getElementById('res-acc').innerText = `${acc}%`;

            let continueContainer = document.getElementById('continue-container');
            let resultTitle = document.getElementById('result-title');

            if (scoreInCurrentRound === 5) {
                resultTitle.innerHTML = "🎉 本關 5 題全部答對！太神啦！";
                if (globalQuestionIndex < shuffledBank.length) {
                    continueContainer.classList.remove('hidden');
                } else {
                    triggerVictory();
                }
            } else {
                resultTitle.innerHTML = "📊 本關結算（未全對）";
                continueContainer.classList.remove('hidden');
            }
        }

        document.getElementById('continue-btn').onclick = function() {
            document.getElementById('result-section').classList.add('hidden');
            startNewRound();
        };

        function triggerVictory() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('back-to-setup-btn').classList.add('hidden');
            document.getElementById('victory-overlay').classList.remove('hidden');
        }

        document.getElementById('victory-close-btn').onclick = function() {
            document.getElementById('victory-overlay').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('page-body').className = "bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-500";
        };

        document.getElementById('back-to-setup-btn').onclick = function() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('back-to-setup-btn').classList.add('hidden');
            document.getElementById('page-body').className = "bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-500";
        };

        document.getElementById('toggle-hint-btn').onclick = function() {
            let subEl = document.getElementById('question-sub');
            if (subEl.classList.contains('hidden')) {
                subEl.classList.remove('hidden');
                this.innerText = "隱藏中文提示";
            } else {
                subEl.classList.add('hidden');
                this.innerText = "💡 顯示中文提示";
            }
        };

        function renderWrongbook() {
            let container = document.getElementById('wrongbook-list');
            let keys = Object.keys(wrongbook);
            document.getElementById('wrong-count-badge').innerText = `${keys.length} 題`;

            if (keys.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-xs">目前沒有錯題記錄。</p>`;
                return;
            }

            container.innerHTML = "";
            keys.forEach(key => {
                let w = wrongbook[key];
                let div = document.createElement('div');
                div.className = "p-3 bg-slate-800/50 border border-slate-700 rounded-xl text-xs space-y-1 text-slate-200";
                div.innerHTML = `
                    <div class="font-bold flex justify-between">
                        <span>${w.answer_en} (${w.meaning_zh})</span>
                        <span class="text-rose-400">錯 ${w.count} 次</span>
                    </div>
                    <div class="text-slate-400">例句：${w.sent_en}</div>
                    <div class="text-slate-500">你的回答：${w.chosen.join(', ')}</div>
                `;
                container.appendChild(div);
            });
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.className = "mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition";
                });
                this.className = "mode-btn py-2 px-3 text-xs font-medium rounded-lg border border-indigo-600 bg-indigo-600 text-white transition";
                currentMode = this.getAttribute('data-mode');
            };
        });

        document.getElementById('start-btn').onclick = initQuiz;
        document.getElementById('restart-btn').onclick = function() {
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('page-body').className = "bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-500";
        };
    </script>
</body>
</html>
